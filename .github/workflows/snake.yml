name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

jobs:
  generate-snake:
    name: Generate GitHub Contribution Snake
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: MahdiJDS

          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=2563eb&color_dots=#dbeafe,#93c5fd,#60a5fa,#2563eb
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=22d3ee&color_dots=#164e63,#0891b2,#06b6d4,#67e8f9

      - name: Deploy snake animation
        uses: crazy-max/ghaction-github-pages@v4

        with:
          target_branch: output
          build_dir: dist

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
